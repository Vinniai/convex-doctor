name: Release to npm

# Manual release: run from the Actions tab (or `gh workflow run publish.yml`).
# Publishes oxlint-plugin-react-convex-doctor first (the CLI resolves it by
# package name at runtime), then react-convex-doctor. Requires the NPM_TOKEN
# repository secret (an npm automation/granular token with publish rights
# for both package names).

on:
  workflow_dispatch:
    inputs:
      dist_tag:
        description: "npm dist-tag to publish under"
        required: false
        default: "latest"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22.18.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - run: pnpm typecheck

      - name: Run test suites
        run: pnpm test

      - name: Publish oxlint-plugin-react-convex-doctor
        working-directory: packages/oxlint-plugin-react-doctor
        run: pnpm publish --access public --no-git-checks --tag "${{ inputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish react-convex-doctor
        working-directory: packages/react-doctor
        run: pnpm publish --access public --no-git-checks --tag "${{ inputs.dist_tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
